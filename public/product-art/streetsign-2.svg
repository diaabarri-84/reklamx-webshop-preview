<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="sign2-t sign2-d">
  <title id="sign2-t">Pavement sign, angled</title>
  <desc id="sign2-d">An A-frame pavement sign seen at an angle, the near panel showing its printed poster and the far panel leaning away.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="sign2-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sign2-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sign2-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sign2-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="sign2-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#sign2-hi)"/>
  <rect width="800" height="800" fill="url(#sign2-lo)"/>
  <ellipse cx="380" cy="668" rx="290" ry="32" fill="url(#sign2-sh)"/>
  <path d="M478 212L590 254L568 602L452 638Z" fill="#c6ccd8" stroke="#b3bac8" stroke-width="3" stroke-linejoin="round"/>
  <path d="M498 250L572 278M496 306L570 330M494 362L568 382" stroke="#b3bac8" stroke-width="3" stroke-linecap="round"/>
  <rect x="434" y="190" width="96" height="26" rx="13" fill="#aeb6c4" transform="rotate(17 482 203)"/>
  <g transform="rotate(6 320 417)">
    <rect x="170" y="196" width="300" height="442" rx="16" fill="#d6dae4" stroke="#bcc3d0" stroke-width="3"/>
