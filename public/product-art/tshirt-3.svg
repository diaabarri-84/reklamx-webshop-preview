<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="tshirt3-t tshirt3-d">
  <title id="tshirt3-t">T-shirt chest print area</title>
  <desc id="tshirt3-d">Close-up of the chest of a t-shirt showing the printable area marked out and an orange logo printed on the fabric.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="tshirt3-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tshirt3-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tshirt3-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tshirt3-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="tshirt3-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <pattern id="tshirt3-knit" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7h14" stroke="#d3d8e2" stroke-width="2" stroke-opacity=".5"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#tshirt3-hi)"/>
  <rect width="800" height="800" fill="url(#tshirt3-lo)"/>
  <ellipse cx="400" cy="700" rx="300" ry="34" fill="url(#tshirt3-sh)"/>
  <rect x="88" y="104" width="624" height="584" rx="44" fill="url(#tshirt3-mat)" stroke="#cbd0db" stroke-width="3"/>
  <rect x="88" y="104" width="624" height="584" rx="44" fill="url(#tshirt3-knit)"/>
  <path d="M292 106C330 202 470 202 508 106" fill="none" stroke="#dfe3ec" stroke-width="16" stroke-linecap="round"/>
  <rect x="206" y="262" width="388" height="296" rx="12" fill="none" stroke="url(#tshirt3-ink)" stroke-width="3" stroke-dasharray="14 11" opacity=".55"/>
  <g fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M206 292v-30h30M594 292v-30h-30M206 528v30h30M594 528v30h-30"/>
  </g>
  <circle cx="400" cy="376" r="66" fill="url(#tshirt3-ink)"/>
  <path d="M372 348L428 404M428 348L372 404" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  <rect x="300" y="470" width="200" height="18" rx="9" fill="#c2410c"/>
  <rect x="332" y="504" width="136" height="15" rx="8" fill="#f97316" opacity=".85"/>
  <g stroke="#9aa3b4" stroke-width="3" stroke-linecap="round">
    <path d="M206 618h388M206 606v24M594 606v24"/>
  </g>
</svg>
