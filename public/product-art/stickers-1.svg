<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="stk1-t stk1-d">
  <title id="stk1-t">A sheet of printed paper stickers</title>
  <desc id="stk1-d">Round, square and rectangular paper stickers laid out on a sheet, one lifting at the corner.</desc>
