    <g fill="#bb965b">
      <circle cx="260" cy="250" r="66"/>
      <rect x="464" y="184" width="132" height="132" rx="22"/>
      <rect x="196" y="384" width="180" height="96" rx="18"/>
      <ellipse cx="530" cy="432" rx="82" ry="52"/>
      <circle cx="262" cy="580" r="58"/>
      <rect x="446" y="530" width="152" height="98" rx="20"/>
    </g>
    <g fill="#ffffff" opacity=".92">
      <circle cx="260" cy="250" r="34"/>
      <rect x="498" y="230" width="64" height="18" rx="9"/>
      <rect x="228" y="422" width="116" height="20" rx="10"/>
