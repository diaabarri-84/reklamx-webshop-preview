<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="decal2-t decal2-d">
  <title id="decal2-t">Window decal peeling off its backing</title>
  <desc id="decal2-d">Close-up of a printed decal with one corner lifted away from its backing paper.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="decal2-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal2-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal2-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="decal2-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="decal2-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#decal2-hi)"/>
  <rect width="800" height="800" fill="url(#decal2-lo)"/>
  <ellipse cx="400" cy="704" rx="290" ry="28" fill="url(#decal2-sh)"/>
  <rect x="112" y="132" width="576" height="540" rx="16" fill="#dfe3ec" stroke="#c9cdd8" stroke-width="3"/>
  <g stroke="#cdd2dc" stroke-width="3" stroke-linecap="round">
    <path d="M148 176h504M148 628h380"/>
  </g>
  <path d="M140 160H660V488L510 640H140Z" fill="url(#decal2-mat)" stroke="#cbd0db" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="384" cy="352" r="92" fill="url(#decal2-ink)"/>
  <rect x="355.1" y="323.1" width="57.7" height="57.7" rx="13.9" transform="rotate(45 384.0 352.0)" fill="none" stroke="#ffffff" stroke-width="22" stroke-linejoin="round"/>
  <rect x="268" y="470" width="232" height="22" rx="11" fill="#c2410c"/>
  <rect x="300" y="508" width="168" height="18" rx="9" fill="#f97316" opacity=".9"/>
  <path d="M512 636C560 596 606 548 656 490C692 528 716 566 728 596C674 640 620 668 566 682Z" fill="#c9cdd8" opacity=".45"/>
  <path d="M660 486C700 526 724 566 736 598C678 646 620 674 562 688C544 668 528 652 508 638Z" fill="#eaedf3" stroke="#c3c9d6" stroke-width="3" stroke-linejoin="round"/>
  <path d="M672 512C700 540 716 566 726 590" fill="none" stroke="#d5d9e3" stroke-width="3" stroke-linecap="round"/>
