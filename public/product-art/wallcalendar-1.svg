<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="cal1-t cal1-d">
  <title id="cal1-t">Printed wall calendar</title>
  <desc id="cal1-d">A wire-bound wall calendar hanging from a hook, with an orange printed picture panel above the month grid.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="cal1-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cal1-lo" cx=".85" cy=".88" r=".8">
