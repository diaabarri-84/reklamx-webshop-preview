<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="bottle2-t bottle2-d">
  <title id="bottle2-t">Bottle print area</title>
  <desc id="bottle2-d">Close-up of the middle of a drinks bottle showing the wrap-around print area and an orange printed logo.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="bottle2-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottle2-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottle2-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottle2-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="bottle2-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#bottle2-hi)"/>
  <rect width="800" height="800" fill="url(#bottle2-lo)"/>
  <rect x="180" y="30" width="440" height="740" fill="url(#bottle2-mat)"/>
  <rect x="212" y="30" width="46" height="740" fill="#ffffff" opacity=".5"/>
  <rect x="562" y="30" width="34" height="740" fill="#c9cdd8" opacity=".45"/>
  <path d="M180 30v740M620 30v740" stroke="#c3c9d6" stroke-width="3"/>
  <rect x="180" y="248" width="440" height="312" fill="url(#bottle2-ink)"/>
  <rect x="212" y="248" width="46" height="312" fill="#ffffff" opacity=".16"/>
  <circle cx="400" cy="372" r="62" fill="none" stroke="#ffffff" stroke-width="13"/>
  <rect x="385.2" y="357.2" width="29.6" height="29.6" rx="7.1" transform="rotate(45 400.0 372.0)" fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round"/>
  <rect x="300" y="470" width="200" height="20" rx="10" fill="#ffffff" opacity=".95"/>
  <rect x="332" y="506" width="136" height="16" rx="8" fill="#ffffff" opacity=".65"/>
  <rect x="206" y="272" width="388" height="264" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 11" opacity=".5"/>
  <g stroke="#9aa3b4" stroke-width="3" stroke-linecap="round">
    <path d="M140 248v312M128 248h24M128 560h24"/>
  </g>
</svg>
