<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="decal3-t decal3-d">
  <title id="decal3-t">Contour-cut decal shape</title>
  <desc id="decal3-d">A shield-shaped printed decal shown on a transparency grid with its contour cut line marked around it.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="decal3-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal3-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal3-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="decal3-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="decal3-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <pattern id="decal3-chk" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#edeff5"/>
      <rect width="24" height="24" fill="#dfe3ec"/>
      <rect x="24" y="24" width="24" height="24" fill="#dfe3ec"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#decal3-hi)"/>
  <rect width="800" height="800" fill="url(#decal3-lo)"/>
  <rect x="112" y="132" width="576" height="536" rx="28" fill="url(#decal3-chk)" stroke="#c9cdd8" stroke-width="3"/>
  <path d="M400 222L546 286C546 406 504 486 400 546C296 486 254 406 254 286Z" fill="none" stroke="#7f8899" stroke-width="3" stroke-dasharray="13 10"/>
  <path d="M400 256L516 306C516 404 482 468 400 516C318 468 284 404 284 306Z" fill="url(#decal3-ink)"/>
  <circle cx="400" cy="356" r="44" fill="none" stroke="#ffffff" stroke-width="11"/>
  <rect x="389.6" y="345.6" width="20.7" height="20.7" rx="5.0" transform="rotate(45 400.0 356.0)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <rect x="336" y="428" width="128" height="15" rx="8" fill="#ffffff" opacity=".95"/>
  <rect x="358" y="456" width="84" height="12" rx="6" fill="#ffffff" opacity=".65"/>
  <g stroke="#9aa3b4" stroke-width="3" stroke-linecap="round">
    <path d="M152 172h44M152 172v44M648 628h-44M648 628v-44"/>
  </g>
  <path d="M180 592h40v40h-40z" fill="none" stroke="#7f8899" stroke-width="3" stroke-dasharray="13 10"/>
  <path d="M236 612h72" stroke="#9aa3b4" stroke-width="3" stroke-linecap="round"/>
</svg>
