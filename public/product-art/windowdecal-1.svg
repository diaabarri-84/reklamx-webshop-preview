<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="decal1-t decal1-d">
  <title id="decal1-t">Window decal on a shop window</title>
  <desc id="decal1-d">A shop window with an orange die-cut decal applied to the glass.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="decal1-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal1-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="decal1-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="decal1-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="decal1-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#decal1-hi)"/>
  <rect width="800" height="800" fill="url(#decal1-lo)"/>
  <rect x="126" y="132" width="548" height="536" rx="14" fill="#eff2f8"/>
  <path d="M170 668L330 132L410 132L250 668Z" fill="#ffffff" opacity=".55"/>
  <path d="M400 668L490 132L530 132L440 668Z" fill="#ffffff" opacity=".4"/>
  <path d="M126 596h548v72H126z" fill="#dde1ea"/>
  <rect x="126" y="238" width="548" height="16" fill="#c9cfda"/>
  <rect x="110" y="116" width="580" height="568" rx="26" fill="none" stroke="#c3c9d6" stroke-width="18"/>
  <rect x="101" y="107" width="598" height="586" rx="32" fill="none" stroke="#b3bac8" stroke-width="3"/>
  <circle cx="400" cy="404" r="80" fill="none" stroke="#ffffff" stroke-width="12"/>
  <circle cx="400" cy="404" r="74" fill="url(#decal1-ink)"/>
