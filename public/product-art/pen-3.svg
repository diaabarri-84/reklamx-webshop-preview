<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="pen3-t pen3-d">
  <title id="pen3-t">Pen in use</title>
  <desc id="pen3-d">A simplified hand holding a printed pen and drawing an orange line across a card.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="pen3-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pen3-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pen3-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pen3-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="pen3-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#pen3-hi)"/>
  <rect width="800" height="800" fill="url(#pen3-lo)"/>
  <ellipse cx="400" cy="690" rx="260" ry="26" fill="url(#pen3-sh)"/>
  <rect x="120" y="430" width="560" height="248" rx="22" fill="url(#pen3-mat)" stroke="#c9cdd8" stroke-width="3"/>
  <path d="M168 636h284" stroke="#d5d9e3" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 592C244 540 288 636 340 578C388 524 424 616 478 560" fill="none" stroke="url(#pen3-ink)" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(430 356) rotate(-50)">
    <rect x="-92" y="-46" width="268" height="188" rx="66" fill="#dfe3ec" stroke="#c9cdd8" stroke-width="3"/>
    <path d="M-238 0L-180-22L-180 22Z" fill="#98a1b2"/>
    <rect x="-182" y="-24" width="60" height="48" rx="12" fill="#b6bdcb"/>
    <rect x="-126" y="-28" width="340" height="56" rx="15" fill="url(#pen3-mat)" stroke="#c3c9d6" stroke-width="3"/>
    <circle cx="-98" cy="0" r="20" fill="url(#pen3-ink)"/>
    <rect x="-103.9" y="-5.9" width="11.8" height="11.8" rx="2.8" transform="rotate(45 -98.0 0.0)" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <rect x="110" y="-8" width="86" height="15" rx="7" fill="#c2410c"/>
    <rect x="196" y="-20" width="42" height="40" rx="13" fill="#b6bdcb"/>
    <g fill="#e9ecf3" stroke="#c9cdd8" stroke-width="3">
      <rect x="-60" y="-58" width="48" height="150" rx="24"/>
      <rect x="-4" y="-64" width="48" height="158" rx="24"/>
      <rect x="52" y="-58" width="48" height="150" rx="24"/>
      <rect x="-96" y="46" width="150" height="46" rx="23"/>
