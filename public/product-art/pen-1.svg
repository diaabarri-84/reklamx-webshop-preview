<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="pen1-t pen1-d">
  <title id="pen1-t">Printed ballpoint pen</title>
  <desc id="pen1-d">A ballpoint pen lying at a slight angle, its barrel carrying an orange printed logo.</desc>
  <!--
    Interim illustration, not a photograph of the shop's own product. Flat vector
    art sitting on the shop surface (#e8eaf1) so an unphotographed product still
    looks deliberate. Orange is reserved for the printing, because the printing
    is what we sell. Replaced per product from the dashboard image field.
  -->
  <defs>
    <radialGradient id="pen1-hi" cx=".2" cy=".16" r=".82">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pen1-lo" cx=".85" cy=".88" r=".8">
      <stop offset="0" stop-color="#c9cdd8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c9cdd8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pen1-sh" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b4bbc9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#b4bbc9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pen1-mat" x1="0" y1="0" x2=".55" y2="1">
      <stop offset="0" stop-color="#fdfeff"/>
      <stop offset="1" stop-color="#dde1eb"/>
    </linearGradient>
    <linearGradient id="pen1-ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#e8eaf1"/>
  <rect width="800" height="800" fill="url(#pen1-hi)"/>
  <rect width="800" height="800" fill="url(#pen1-lo)"/>
  <g transform="rotate(-11 400 400)">
    <ellipse cx="410" cy="478" rx="275" ry="24" fill="url(#pen1-sh)"/>
    <path d="M150 400L208 376L208 424Z" fill="#98a1b2"/>
    <rect x="204" y="372" width="64" height="56" rx="14" fill="#b6bdcb"/>
    <rect x="262" y="368" width="364" height="64" rx="18" fill="url(#pen1-mat)" stroke="#c3c9d6" stroke-width="3"/>
    <rect x="276" y="382" width="336" height="13" rx="6" fill="#ffffff" opacity=".55"/>
    <rect x="276" y="414" width="336" height="10" rx="5" fill="#c9cdd8" opacity=".45"/>
    <circle cx="322" cy="400" r="23" fill="url(#pen1-ink)"/>
    <rect x="314.6" y="392.6" width="14.8" height="14.8" rx="3.6" transform="rotate(45 322.0 400.0)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
    <rect x="362" y="383" width="170" height="15" rx="8" fill="#c2410c"/>
    <rect x="362" y="406" width="112" height="12" rx="6" fill="#f97316" opacity=".9"/>
    <rect x="524" y="340" width="96" height="26" rx="13" fill="#aeb6c4"/>
    <rect x="596" y="340" width="24" height="46" rx="10" fill="#aeb6c4"/>
    <rect x="614" y="360" width="18" height="80" rx="9" fill="#98a1b2"/>
    <rect x="630" y="378" width="48" height="44" rx="14" fill="#b6bdcb"/>
  </g>
</svg>
